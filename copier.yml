_min_copier_version: 9.19.1
_answers_file: .copier/.copier-answers.yml

project_name:
  type: str
  help: Lowercase repository slug
  default: my-registry
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}
    Use lowercase letters, numbers, and dashes, starting with a letter.
    {% endif %}

github_username:
  type: str
  help: GitHub user or organization
  validator: >-
    {% if not (github_username | regex_search('^[a-zA-Z0-9][a-zA-Z0-9-]*$')) %}
    Enter a GitHub user or organization name.
    {% endif %}

github_url:
  type: str
  default: "https://github.com/{{ github_username }}/{{ project_name }}"

github_pages_url:
  type: str
  help: Public site URL (a custom domain is supported)
  default: "https://{{ github_username }}.github.io/{{ project_name }}/"

# Starter content is copied initially, then owned by the generated project.
_exclude:
  - /.git
  - /node_modules
  - /dist
  - /public/r
  - /coverage
  - /playwright-report
  - /test-results
  - "*.tsbuildinfo"
  - /copier.yml
  - /README.md
  - /scripts/test-template.py
  - /.github/workflows/template.yml
  - /.env
  - /.env.local
  - "{% if _copier_operation == 'update' %}/registry{% endif %}"
  - "{% if _copier_operation == 'update' %}/registry.json{% endif %}"
  - "{% if _copier_operation == 'update' %}/app/examples{% endif %}"
  - "{% if _copier_operation == 'update' %}/app/page.tsx{% endif %}"
  - "{% if _copier_operation == 'update' %}/index.html{% endif %}"

_tasks:
  - command: ["{{ _copier_python }}", .copier/bootstrap.py]
    when: "{{ _copier_operation == 'copy' }}"

_message_after_copy: |
  Your registry includes four working examples.

  1. Run `mise install`, then `mise exec -- pnpm install --frozen-lockfile`.
  2. Run `mise exec -- pnpm dev` to preview or `mise exec -- pnpm build` to build.
  3. Enable GitHub Pages: Settings → Pages → Source → GitHub Actions.
  4. Push to your default branch to deploy. No Pages personal access token is needed.
  5. Add your items to registry.json and previews to app/examples/<item-name>.tsx.
